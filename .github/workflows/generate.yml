name: Generate 3D Game Asset
on:
  workflow_dispatch:
    inputs:
      model_choice:
        description: 'Pick AI model to use'
        required: true
        default: 'TripoSR'
        type: choice
        options:
        - TripoSR - Best free quality, 4min
        - Shap-E - Fastest, unlimited, 3min
      prompt:
        description: 'Describe your game asset'
        required: true
        default: 'stylized fantasy treasure chest'
      poly_count:
        description: 'Target polycount'
        required: true
        default: 'medium'
        type: choice
        options:
        - low - 5k tris, mobile games
        - medium - 20k tris, PC/indie
        - high - 100k tris, for baking

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          
      - name: Generate with ${{ github.event.inputs.model_choice }}
        run: |
          python generate.py "${{ github.event.inputs.model_choice }}" "${{ github.event.inputs.prompt }}" "${{ github.event.inputs.poly_count }}"
          
      - name: Upload 3D Model
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.prompt }}-${{ github.event.inputs.model_choice }}
          path: |
            output.glb
            concept.png
          retention-days: 7
